name: Sonar scan
on:
  workflow_call:
    inputs:
      project-key:
        type: string
        required: true
      organization:
        type: string
        required: true
      coverage-artifact:
        type: string
        default: ''
    secrets:
      SONAR_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  scan:
    name: Sonar analysis
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download caller coverage
        if: inputs.coverage-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.coverage-artifact }}
          path: .sonar-coverage
      - name: Verify configured source and coverage
        env:
          COVERAGE_ARTIFACT: ${{ inputs.coverage-artifact }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          config = Path('sonar-project.properties')
          if not config.is_file():
              raise SystemExit('Missing repo-owned sonar-project.properties')
          if os.environ['COVERAGE_ARTIFACT'] and not any(p.is_file() and p.stat().st_size for p in Path('.sonar-coverage').rglob('*')):
              raise SystemExit('Coverage artifact is empty')
          PY
      - name: Scan exact candidate and await quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ inputs.project-key }}
            -Dsonar.organization=${{ inputs.organization }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Preserve scanner task receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonar-task-${{ github.event.pull_request.head.sha || github.sha }}
          path: .scannerwork/report-task.txt
          if-no-files-found: warn
          retention-days: 14
